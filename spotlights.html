<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Member Spotlights · Tri Oaks Ward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400&family=Montserrat:wght@300;500&display=swap">
  <style>
    :root {
      --ink: rgb(4, 38, 48);
      --accent: rgb(76, 114, 115);
      --muted: rgba(4, 38, 48, 0.55);
      --line: rgba(76, 114, 115, 0.35);
      --bg: #fff;
      --hover: rgba(76, 114, 115, 0.08);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Montserrat", sans-serif;
      font-weight: 300;
      font-size: 18px;
      line-height: 1.5;
      overflow-wrap: break-word;
    }
    main { max-width: 620px; margin: 0 auto; padding: 24px 16px 64px; }
    .eyebrow { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 500; text-align: center; }
    .eyebrow a { color: inherit; text-decoration: none; }
    h1, h2 { font-family: "Lora", serif; font-style: italic; font-weight: 400; color: var(--accent); margin: 0; }
    h1 { font-size: 32px; text-align: center; padding: 14px 0 6px; }
    .sub { text-align: center; color: var(--muted); font-size: 15px; margin: 0 0 24px; }
    .status { text-align: center; padding: 48px 0; color: var(--muted); }

    form { max-width: 340px; margin: 24px auto 0; text-align: center; }
    input[type=password], input[type=text] {
      width: 100%; padding: 12px 14px; font: inherit; font-size: 17px; border: 1px solid var(--line); border-radius: 12px; text-align: center;
    }
    button {
      margin-top: 12px; padding: 11px 24px; border: 1px solid var(--accent); border-radius: 999px;
      background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer;
    }
    .error { color: #8a2020; font-size: 15px; margin-top: 12px; min-height: 1.4em; }
    .hint { color: var(--muted); font-size: 14px; margin-top: 16px; }

    .year { font-weight: 500; color: var(--accent); padding: 20px 0 6px; border-bottom: 1px solid var(--line); }
    .item {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      width: 100%; padding: 12px 6px; border: 0; border-bottom: 1px solid rgba(76, 114, 115, 0.15);
      background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    .item:hover { background: var(--hover); }
    .item .name { font-weight: 500; }
    .item .when { color: var(--muted); font-size: 14px; white-space: nowrap; }

    .back { display: inline-block; margin: 4px 0 8px; color: var(--accent); text-decoration: none; font-size: 15px; }
    article .date { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 20px; }
    article p { margin: 0 0 14px; }
    article h3, article h4 { font-family: "Lora", serif; font-style: italic; font-weight: 400; color: var(--accent); margin: 22px 0 8px; }
    article h3 { font-size: 23px; } article h4 { font-size: 20px; }
    article img { display: block; max-width: 100%; height: auto; margin: 18px auto; border-radius: 12px; box-shadow: 0 8px 24px rgba(4, 38, 48, 0.15); }
    article a { color: var(--accent); }
    .foot { text-align: center; margin-top: 32px; font-size: 15px; }
    .foot a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow"><a href="./">Tri Oaks Ward</a> · Member Spotlights</div>
  <div id="view"><div class="status">Loading…</div></div>
</main>

<script>
  // Password-protected Member Spotlights. The password is checked by the ward's Apps Script server, which
  // only then returns the spotlights (Google Docs in the ward's Drive). It's remembered on this device.
  var API_URL = 'https://script.google.com/macros/s/AKfycbwbfE5bAvaC2rSJs-HMSCQ8Gc9xCJl7-Pk-W66HXUu0MBwJgPHzSMPxdVXv23gLjpet/exec';
  var PW_KEY = 'spotlight-password';
  var view = document.getElementById('view');
  var list = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function getPw() { try { return localStorage.getItem(PW_KEY) || ''; } catch (e) { return ''; } }
  function setPw(p) { try { p ? localStorage.setItem(PW_KEY, p) : localStorage.removeItem(PW_KEY); } catch (e) {} }

  function api(body) {
    body.password = getPw();
    // text/plain keeps this a "simple" request, so the browser doesn't need a CORS preflight.
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function(r) { return r.json(); });
  }

  function formatDate(iso, withDay) {
    var p = iso.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', withDay ? { month: 'long', day: 'numeric', year: 'numeric' } : { month: 'long', year: 'numeric' });
  }

  function showPasswordForm(message) {
    view.innerHTML = '<h1>Member Spotlights</h1><p class="sub">Getting to know the members of our ward</p>' +
      '<form id="pw"><input id="pwInput" type="password" autocomplete="current-password" placeholder="Ward password" aria-label="Ward password">' +
      '<button type="submit">Open</button><div class="error" id="err">' + esc(message || '') + '</div>' +
      '<div class="hint">The password is on the signs by the chapel doors.</div></form>';
    document.getElementById('pw').onsubmit = function(e) {
      e.preventDefault();
      setPw(document.getElementById('pwInput').value.trim());
      loadList();
    };
    document.getElementById('pwInput').focus();
  }

  function handleError(res) {
    if (res && res.badPassword) { setPw(''); showPasswordForm('That password isn’t right. Please try again.'); return; }
    if (res && res.locked) { showPasswordForm(res.error); return; }
    view.innerHTML = '<div class="status">' + esc((res && res.error) || 'Unable to load right now.') + '</div>';
  }

  function loadList() {
    if (!getPw()) { showPasswordForm(); return; }
    view.innerHTML = '<div class="status">Loading…</div>';
    api({ action: 'spotlights' }).then(function(res) {
      if (!res.ok) return handleError(res);
      list = res.spotlights;
      route();
    }).catch(function() { handleError(null); });
  }

  function showList() {
    var html = '<h1>Member Spotlights</h1><p class="sub">Getting to know the members of our ward</p>';
    var year = '';
    list.forEach(function(s) {
      var y = s.date.slice(0, 4);
      if (y !== year) { html += '<div class="year">' + y + '</div>'; year = y; }
      html += '<button class="item" data-id="' + esc(s.id) + '"><span class="name">' + esc(s.title) + '</span>' +
        '<span class="when">' + esc(formatDate(s.date).replace(/ \d{4}$/, '')) + '</span></button>';
    });
    if (!list.length) html += '<div class="status">No spotlights yet.</div>';
    html += '<div class="foot"><a href="./">← Sacrament program</a></div>';
    view.innerHTML = html;
    view.querySelectorAll('.item').forEach(function(b) {
      b.onclick = function() { location.hash = b.getAttribute('data-id'); };
    });
  }

  function showSpotlight(id) {
    var item = list.filter(function(s) { return s.id === id; })[0];
    view.innerHTML = '<a class="back" href="#">← All spotlights</a>' +
      (item ? '<h1>' + esc(item.title) + '</h1><div class="status">Loading…</div>' : '<div class="status">Loading…</div>');
    window.scrollTo(0, 0);
    api({ action: 'spotlight', id: id }).then(function(res) {
      if (!res.ok) return handleError(res);
      var s = res.spotlight;
      if (location.hash.slice(1) !== id) return;   // the reader moved on
      view.innerHTML = '<a class="back" href="#">← All spotlights</a><article><h1>' + esc(s.title) + '</h1>' +
        (s.date ? '<div class="date">' + esc(formatDate(s.date, true)) + '</div>' : '') + s.html + '</article>' +
        '<div class="foot"><a href="#">← All spotlights</a></div>';
    }).catch(function() { handleError(null); });
  }

  // #<doc id> shows one spotlight; no hash shows the list. The back button works between them.
  function route() {
    if (!list) return;
    var id = location.hash.slice(1);
    if (id) showSpotlight(id); else showList();
  }
  window.addEventListener('hashchange', route);

  loadList();
</script>
</body>
</html>
