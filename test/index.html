<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tri Oaks Ward Sacrament Program</title>
  <meta name="description" content="This week's sacrament meeting program for the Tri Oaks Ward.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400&family=Montserrat:wght@300;500&display=swap">
  <style>
    :root {
      --ink: rgb(4, 38, 48);
      --accent: rgb(76, 114, 115);
      --muted: rgba(4, 38, 48, 0.55);
      --line: rgba(76, 114, 115, 0.35);
      --bg: #fff;
      --hover: rgba(76, 114, 115, 0.08);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Montserrat", sans-serif;
      font-weight: 300;
      font-size: 19px;
      line-height: 1.35;
      overflow-wrap: break-word;
      text-align: center;
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    h1, h2 {
      font-family: "Lora", serif;
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
      margin: 0;
    }
    h1 { font-size: 32px; }
    h2 { font-size: 24px; padding: 40px 0 4px; }

    .hero img {
      display: block;
      width: min(300px, 72vw);
      height: auto;
      margin: 20px auto 0;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(4, 38, 48, 0.18);
    }

    .date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 16px 0 0;
    }
    .date-btn, .arrow {
      background: none;
      border: 0;
      border-radius: 10px;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .date-btn { padding: 6px 10px; }
    .date-btn:hover, .arrow:hover:not(:disabled) { background: var(--hover); }
    .date-btn h1 { border-bottom: 1px dashed transparent; }
    .date-btn:hover h1 { border-bottom-color: var(--line); }
    .arrow {
      width: 44px;
      height: 44px;
      flex: none;
      display: grid;
      place-items: center;
      color: var(--accent);
    }
    .arrow:disabled { visibility: hidden; }
    .arrow svg { width: 22px; height: 22px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .special {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 14px;
      color: var(--accent);
    }

    .label { color: var(--accent); padding: 20px 0 0; }
    .value a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    .value a:hover { text-decoration-color: var(--accent); }

    hr { max-width: 280px; border: 0; border-top: 1px solid var(--accent); margin: 40px auto 0; }
    hr + h2 { padding-top: 20px; }
    h2 + hr { margin-top: 20px; }

    .status { padding: 64px 0; color: var(--muted); }
    .status button {
      margin-top: 16px;
      padding: 10px 20px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: none;
      color: var(--accent);
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }
    .muted { color: var(--muted); }
    .notice { max-width: 420px; margin: 0 auto; padding: 28px 0 0; }
    .note { max-width: 420px; margin: 0 auto; padding: 6px 0 0; font-size: 16px; color: var(--muted); }
    .details h3 {
      font-family: "Lora", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 21px;
      color: var(--accent);
      margin: 0;
      padding: 28px 0 0;
    }
    .details .line { padding: 12px 0 0; }
    .details .gap { height: 12px; }

    #program { transition: opacity 0.15s; }
    #program.loading { opacity: 0.35; }

    dialog {
      width: min(420px, calc(100vw - 32px));
      max-height: min(560px, calc(100vh - 64px));
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 16px;
      color: var(--ink);
      background: var(--bg);
      box-shadow: 0 20px 60px rgba(4, 38, 48, 0.25);
    }
    dialog::backdrop { background: rgba(4, 38, 48, 0.35); }
    dialog[open] { display: flex; flex-direction: column; }
    .dlg-head {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 12px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .dlg-head h2 { padding: 0; font-size: 22px; }
    .dlg-close { width: 40px; height: 40px; border: 0; border-radius: 10px; background: none; color: var(--accent); font-size: 26px; cursor: pointer; }
    .dlg-close:hover { background: var(--hover); }
    .dlg-body { overflow-y: auto; padding: 0 20px 20px; }
    .year {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 12px 0 8px;
      background: var(--bg);
      font-weight: 500;
      color: var(--accent);
      text-align: left;
    }
    .dates { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }
    .dates button {
      padding: 8px 4px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: none;
      color: inherit;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }
    .dates button:hover { background: var(--hover); }
    .dates button[aria-current="date"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    .dates .tag { display: block; margin-top: 2px; font-size: 11px; font-weight: 500; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dates button[aria-current="date"] .tag { color: rgba(255, 255, 255, 0.85); }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">TEST · Tri Oaks Ward · Sacrament Service</div>

  <picture class="hero">
    <source srcset="../remember_jesus_sacrament.avif" type="image/avif">
    <img src="../remember_jesus_sacrament.jpg" width="640" height="800" alt="Jesus Christ breaking bread">
  </picture>

  <div class="date-nav">
    <button class="arrow" id="prev" aria-label="Previous program" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="date-btn" id="dateBtn" aria-label="Choose a date" aria-haspopup="dialog"><h1 id="dateTitle">&nbsp;</h1></button>
    <button class="arrow" id="next" aria-label="Next program" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div id="program" aria-live="polite"><div class="status">Loading program…</div></div>
</main>

<dialog id="picker" aria-labelledby="pickerTitle">
  <div class="dlg-head">
    <h2 id="pickerTitle">Programs</h2>
    <button class="dlg-close" id="pickerClose" aria-label="Close">&times;</button>
  </div>
  <div class="dlg-body" id="pickerBody"></div>
</dialog>

<script>
  // Read-only Apps Script endpoint (ProgramAdmin project).
  // Returns { ok, today, upcoming, dates: [{ date, special }], program }.
  var API_URL = 'https://script.google.com/macros/s/AKfycbxt5rCjRksc0F-NpJw6-TvaFHCbFDCtWpK2VpgTtlCRjyfH6uxJjUGCesQsGtzH3eif/exec';
  var CACHE_PREFIX = 'test-program2:';
  var REFRESH_MS = 10 * 60 * 1000; // re-check the sheet while the page stays open

  // How each "Special Program" value is shown. Keys are lowercase. Values not listed here are
  // shown as a regular meeting with the value as its label.
  //   none    — no ward sacrament meeting that Sunday; show a short notice instead of a program
  //   alt     — ward meeting where `heading` (+ `text`) replaces the speakers
  //   regular — ward meeting with speakers (at least 2)
  var TYPES = {
    'general conference': { kind: 'none', tag: 'Gen Conf', invite: 'watch General Conference' },
    'stake conference': { kind: 'none', tag: 'Stake Conf', invite: 'attend Stake Conference' },
    'temple dedication': { kind: 'none', tag: 'Temple', reason: 'in observance of the temple dedication' },
    'fast sunday': { kind: 'alt', tag: 'Fast', heading: 'Bearing of Testimonies' },
    'musical testimony meeting': { kind: 'alt', tag: 'Musical', heading: 'Hymns of Testimony',
      text: 'Members share a brief testimony and a favorite hymn, which the congregation then sings together.' },
    'primary program': { kind: 'alt', tag: 'Primary', heading: 'Primary Program',
      text: 'Presented by the children of the Tri Oaks Ward Primary' },
    'christmas program': { kind: 'alt', tag: 'Christmas', heading: 'Christmas Program',
      text: 'A program of music and the spoken word celebrating the birth of Jesus Christ' },
    'easter program': { kind: 'alt', tag: 'Easter', heading: 'Easter Program',
      text: 'A program of music and the spoken word celebrating the Resurrection of Jesus Christ' },
    'ward conference': { kind: 'regular', tag: 'Ward Conf' },
    "mother's day program": { kind: 'regular', tag: "Mother's Day" },
    'under stake direction': { kind: 'regular', tag: 'Stake' },
    'under the direction of the stake': { kind: 'regular', tag: 'Stake' },
    'no special program': { kind: 'regular' }
  };
  var MIN_SPEAKERS = 2;

  var state = { dates: [], specials: {}, current: null, requested: '', shownJson: '', loadSeq: 0 };
  var el = function(id) { return document.getElementById(id); };

  // ── Data ────────────────────────────────────────────────────────────────

  function cacheGet(key) {
    try { return JSON.parse(localStorage.getItem(CACHE_PREFIX + key)); } catch (e) { return null; }
  }
  function cacheSet(key, data) {
    try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(data)); } catch (e) {}
  }

  // silent: background re-check of the page being viewed — no spinner, no error message.
  function load(date, push, silent) {
    var seq = ++state.loadSeq;
    var key = date || 'current';

    // Show the last copy we saw right away, then refresh from the sheet.
    var cached = silent ? null : cacheGet(key);
    if (cached) show(cached, date, push);
    else if (state.current && !silent) el('program').classList.add('loading');

    fetch(API_URL + (date ? '?date=' + encodeURIComponent(date) : ''))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (seq !== state.loadSeq) return;
        if (!data.ok) throw new Error(data.error);
        cacheSet(key, data);
        show(data, date, push && !cached);
      })
      .catch(function() {
        if (seq !== state.loadSeq || cached || silent) return;
        el('program').classList.remove('loading');
        el('program').innerHTML =
          '<div class="status">Unable to load the program right now.<br><button id="retry">Try again</button></div>';
        el('retry').onclick = function() { load(date, false); };
      });
  }

  function show(data, requested, push) {
    var json = JSON.stringify(data);
    if (!push && json === state.shownJson && requested === state.requested) return; // nothing changed
    state.shownJson = json;
    state.requested = requested || '';
    state.dates = (data.dates || []).map(function(d) { return d.date; });
    state.specials = {};
    (data.dates || []).forEach(function(d) { state.specials[d.date] = d.special; });
    var p = data.program;
    state.current = p ? p.date : (requested || data.upcoming);

    el('program').classList.remove('loading');
    el('dateTitle').textContent = formatDate(state.current);
    document.title = formatDate(state.current) + ' · Tri Oaks Ward Sacrament Program';
    updateArrows();

    if (push) {
      history.pushState({ date: requested || '' }, '', requested ? '?date=' + state.current : location.pathname);
    }

    el('program').innerHTML = p ? renderProgram(p, tenseOf(p.date, data.today)) :
      '<div class="status">No program has been posted for this date.</div>';
  }

  // ── Rendering ───────────────────────────────────────────────────────────

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function typeOf(special) {
    var key = String(special || '').toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim();
    return TYPES[key] || (key ? { kind: 'regular', tag: special } : { kind: 'regular' });
  }

  function tenseOf(date, today) {
    return date < today ? 'past' : date === today ? 'today' : 'upcoming';
  }

  function item(label, value) {
    if (!value) return '';
    return '<div class="label">' + esc(label) + '</div><div class="value">' + value + '</div>';
  }

  // Always-shown item: TBA for today/upcoming, "—" for past Sundays when blank.
  function required(label, value, tense) {
    return item(label, value || '<span class="muted">' + (tense === 'past' ? '—' : 'TBA') + '</span>');
  }

  function hymnHtml(h) {
    if (!h) return '';
    var text = h.number ? '#' + h.number + ' – ' + h.title : h.text;
    return h.url ? '<a href="' + esc(h.url) + '" target="_blank" rel="noopener">' + esc(text) + '</a>' : esc(text);
  }

  function renderProgram(p, tense) {
    var type = typeOf(p.special);
    var html = p.special ? '<div class="special">' + esc(p.special) + '</div>' : '';

    if (type.kind === 'none') return html + renderNoMeeting(type, tense) + renderDetails(p);

    html += required('Presiding', esc(p.presiding), tense);
    html += required('Conducting', esc(p.conducting), tense);
    html += required('Chorister', esc(p.chorister), tense);
    html += required('Organist', esc(p.organist), tense);

    html += '<h2>Welcome &amp; Announcements</h2>';
    html += required('Opening Hymn', hymnHtml(p.openingHymn), tense);
    html += required('Opening Prayer', esc(p.openingPrayer), tense);

    html += '<h2>Ward &amp; Stake Business</h2>';
    html += required('Sacrament Hymn', hymnHtml(p.sacramentHymn), tense);

    html += '<hr><h2>Administration of the Sacrament</h2><hr>';

    // Program Details, when filled in, replaces the speakers for any kind of Sunday.
    if (p.details) {
      html += renderDetails(p);
    } else if (type.kind === 'alt') {
      html += '<h2>' + esc(type.heading) + '</h2>';
      if (type.text) html += '<div class="note">' + esc(type.text) + '</div>';
      html += renderTalks(p, 0, tense);
    } else {
      html += renderTalks(p, MIN_SPEAKERS, tense);
    }

    html += required('Closing Hymn', hymnHtml(p.closingHymn), tense);
    html += required('Closing Prayer', esc(p.closingPrayer), tense);
    return html;
  }

  function renderNoMeeting(type, tense) {
    var verb = { past: 'was not held', today: 'is not held today', upcoming: 'will not be held' }[tense];
    var text = 'Sacrament service ' + verb + (type.reason ? ' ' + type.reason : '') + '.';
    if (type.invite) text += ' All ' + (tense === 'past' ? 'were' : 'are') + ' invited to ' + type.invite + '.';
    return '<div class="notice">' + esc(text) + '</div>';
  }

  // Talks in order (padded with TBA/— up to minSpeakers), with the intermediate hymn / musical
  // number placed per the "Intermediate Hymn Position" column (e.g. "After Speaker 1").
  function renderTalks(p, minSpeakers, tense) {
    var talks = [];
    // Youth speakers (a separate column in unconverted year tabs) are listed simply as "Speaker".
    if (p.youthSpeaker) talks.push({ label: 'Speaker', name: esc(p.youthSpeaker), key: 'youth speaker' });
    var speakers = (p.speakers || []).slice();
    while (speakers.length < minSpeakers) speakers.push('');
    speakers.forEach(function(name, i) {
      talks.push({ label: 'Speaker', name: esc(name), key: 'speaker ' + (i + 1) });
    });

    var mid = p.intermediate
      ? item(p.intermediate.number ? 'Intermediate Hymn' : 'Musical Number', hymnHtml(p.intermediate))
      : '';
    if (!talks.length) return mid;

    var pos = String(p.intermediatePosition || '').toLowerCase().replace(/^after\s+/, '').trim();
    var at = -1;
    talks.forEach(function(t, i) { if (t.key === pos) at = i; });
    if (at < 0) {
      // Default: after Speaker 1 when a talk follows it, otherwise after the first talk.
      var s1 = -1;
      talks.forEach(function(t, i) { if (t.key === 'speaker 1') s1 = i; });
      at = s1 >= 0 && s1 < talks.length - 1 ? s1 : 0;
    }

    var html = '';
    talks.forEach(function(t, i) {
      html += required(t.label, t.name, tense);
      if (i === at) html += mid;
    });
    return html;
  }

  // Program Details: one cell, one item per line.
  //   "## Heading"       → section heading
  //   "Label: value"     → label + value, like the rest of the program
  //   "#123" at the start of a value or line → linked hymn with its title
  //   any other line     → a line of text; blank lines add space
  function renderDetails(p) {
    if (!p.details) return '';
    var hymns = p.detailHymns || {};
    var withHymn = function(text) {
      var m = text.match(/^#(\d+)\b\s*(.*)$/);
      var h = m && hymns[m[1]];
      if (!h) return esc(text);
      var label = '#' + m[1] + ' – ' + h.title;
      var link = h.url ? '<a href="' + esc(h.url) + '" target="_blank" rel="noopener">' + esc(label) + '</a>' : esc(label);
      return link + (m[2] ? ' ' + esc(m[2]) : '');
    };

    var html = '';
    var lastBlank = true;
    p.details.split(/\r?\n/).forEach(function(raw) {
      var line = raw.trim();
      if (!line) {
        if (!lastBlank) html += '<div class="gap"></div>';
        lastBlank = true;
        return;
      }
      lastBlank = false;
      var heading = line.match(/^##\s*(.+)$/);
      var colon = line.indexOf(': ');
      if (heading) html += '<h3>' + esc(heading[1]) + '</h3>';
      else if (colon > 0 && colon <= 40) html += item(line.slice(0, colon), withHymn(line.slice(colon + 2).trim()));
      else html += '<div class="line">' + withHymn(line) + '</div>';
    });
    return '<div class="details">' + html + '</div>';
  }

  function formatDate(iso) {
    if (!iso) return '';
    var p = iso.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  // ── Navigation ──────────────────────────────────────────────────────────

  function updateArrows() {
    var i = state.dates.indexOf(state.current);
    el('prev').disabled = i <= 0;
    el('next').disabled = i < 0 || i >= state.dates.length - 1;
  }

  // The newest date is loaded as the default view, so its URL stays clean.
  function go(date) {
    load(date === state.dates[state.dates.length - 1] ? '' : date, true);
  }

  function step(delta) {
    var target = state.dates[state.dates.indexOf(state.current) + delta];
    if (target) go(target);
  }

  el('prev').onclick = function() { step(-1); };
  el('next').onclick = function() { step(1); };
  document.addEventListener('keydown', function(e) {
    if (el('picker').open || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  window.addEventListener('popstate', function(e) {
    load((e.state && e.state.date) || new URLSearchParams(location.search).get('date') || '', false);
  });

  // ── Date picker ─────────────────────────────────────────────────────────

  el('dateBtn').onclick = function() {
    if (!state.dates.length) return;
    var byYear = {};
    state.dates.slice().reverse().forEach(function(d) {
      (byYear[d.slice(0, 4)] = byYear[d.slice(0, 4)] || []).push(d);
    });
    var html = '';
    Object.keys(byYear).sort().reverse().forEach(function(year) {
      html += '<section><div class="year">' + year + '</div><div class="dates">';
      byYear[year].forEach(function(d) {
        var p = d.split('-').map(Number);
        var label = new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        var tag = typeOf(state.specials[d]).tag;
        html += '<button data-date="' + d + '"' + (d === state.current ? ' aria-current="date"' : '') + '>' + label +
          (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + '</button>';
      });
      html += '</div></section>';
    });
    el('pickerBody').innerHTML = html;
    el('picker').showModal();
    var cur = el('pickerBody').querySelector('[aria-current]');
    if (cur) cur.focus();
  };

  el('pickerBody').onclick = function(e) {
    var btn = e.target.closest('[data-date]');
    if (!btn) return;
    el('picker').close();
    go(btn.getAttribute('data-date'));
  };
  el('pickerClose').onclick = function() { el('picker').close(); };
  el('picker').addEventListener('click', function(e) { if (e.target === el('picker')) el('picker').close(); });

  // ── Keep an open page up to date ────────────────────────────────────────
  // There's no way to push changes to an open page, so re-check when the viewer comes back
  // to it (e.g. unlocks their phone) and periodically while it's visible.

  function refresh() {
    if (document.visibilityState === 'visible' && !el('picker').open) load(state.requested, false, true);
  }
  document.addEventListener('visibilitychange', refresh);
  setInterval(refresh, REFRESH_MS);

  // ── Start ───────────────────────────────────────────────────────────────

  var initial = new URLSearchParams(location.search).get('date') || '';
  history.replaceState({ date: initial }, '', location.href);
  load(initial, false);
</script>
</body>
</html>
