<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tri Oaks Ward Sacrament Program</title>
  <meta name="description" content="This week's sacrament meeting program for the Tri Oaks Ward.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400&family=Montserrat:wght@300;500&display=swap">
  <style>
    :root {
      --ink: rgb(4, 38, 48);
      --accent: rgb(76, 114, 115);
      --muted: rgba(4, 38, 48, 0.55);
      --line: rgba(76, 114, 115, 0.35);
      --bg: #fff;
      --hover: rgba(76, 114, 115, 0.08);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Montserrat", sans-serif;
      font-weight: 300;
      font-size: 19px;
      line-height: 1.35;
      overflow-wrap: break-word;
      text-align: center;
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    h1, h2 {
      font-family: "Lora", serif;
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
      margin: 0;
    }
    h1 { font-size: 32px; }
    h2 { font-size: 24px; padding: 40px 0 4px; }

    .hero img {
      display: block;
      width: min(300px, 72vw);
      height: auto;
      margin: 20px auto 0;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(4, 38, 48, 0.18);
    }

    .date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 16px 0 0;
    }
    .date-btn, .arrow {
      background: none;
      border: 0;
      border-radius: 10px;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .date-btn { padding: 6px 10px; }
    .date-btn:hover, .arrow:hover:not(:disabled) { background: var(--hover); }
    .date-btn h1 { border-bottom: 1px dashed transparent; }
    .date-btn:hover h1 { border-bottom-color: var(--line); }
    .arrow {
      width: 44px;
      height: 44px;
      flex: none;
      display: grid;
      place-items: center;
      color: var(--accent);
    }
    .arrow:disabled { visibility: hidden; }
    .arrow svg { width: 22px; height: 22px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .special {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 14px;
      color: var(--accent);
    }

    .label { color: var(--accent); padding: 20px 0 0; }
    .value a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    .value a:hover { text-decoration-color: var(--accent); }

    hr { max-width: 280px; border: 0; border-top: 1px solid var(--accent); margin: 40px auto 0; }
    hr + h2 { padding-top: 20px; }
    h2 + hr { margin-top: 20px; }

    .status { padding: 64px 0; color: var(--muted); }
    .status button {
      margin-top: 16px;
      padding: 10px 20px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: none;
      color: var(--accent);
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }
    #program { transition: opacity 0.15s; }
    #program.loading { opacity: 0.35; }

    dialog {
      width: min(420px, calc(100vw - 32px));
      max-height: min(560px, calc(100vh - 64px));
      padding: 0;
      border: 0;
      border-radius: 16px;
      color: var(--ink);
      background: var(--bg);
      box-shadow: 0 20px 60px rgba(4, 38, 48, 0.25);
    }
    dialog::backdrop { background: rgba(4, 38, 48, 0.35); }
    .dlg-head {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 12px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .dlg-head h2 { padding: 0; font-size: 22px; }
    .dlg-close { width: 40px; height: 40px; border: 0; border-radius: 10px; background: none; color: var(--accent); font-size: 26px; cursor: pointer; }
    .dlg-close:hover { background: var(--hover); }
    .dlg-body { padding: 4px 20px 20px; }
    .year { padding: 16px 0 8px; font-weight: 500; color: var(--accent); text-align: left; }
    .dates { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }
    .dates button {
      padding: 8px 4px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: none;
      color: inherit;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }
    .dates button:hover { background: var(--hover); }
    .dates button[aria-current="date"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Tri Oaks Ward · Sacrament Service</div>

  <picture class="hero">
    <source srcset="remember_jesus_sacrament.avif" type="image/avif">
    <img src="remember_jesus_sacrament.jpg" width="640" height="800" alt="Jesus Christ breaking bread">
  </picture>

  <div class="date-nav">
    <button class="arrow" id="prev" aria-label="Previous program" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="date-btn" id="dateBtn" aria-label="Choose a date" aria-haspopup="dialog"><h1 id="dateTitle">&nbsp;</h1></button>
    <button class="arrow" id="next" aria-label="Next program" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div id="program" aria-live="polite"><div class="status">Loading program…</div></div>
</main>

<dialog id="picker" aria-labelledby="pickerTitle">
  <div class="dlg-head">
    <h2 id="pickerTitle">Past Programs</h2>
    <button class="dlg-close" id="pickerClose" aria-label="Close">&times;</button>
  </div>
  <div class="dlg-body" id="pickerBody"></div>
</dialog>

<script>
  // Read-only Apps Script endpoint (ProgramAdmin project). Returns { ok, upcoming, dates, program }.
  var API_URL = 'https://script.google.com/macros/s/AKfycbwbfE5bAvaC2rSJs-HMSCQ8Gc9xCJl7-Pk-W66HXUu0MBwJgPHzSMPxdVXv23gLjpet/exec';
  var CACHE_PREFIX = 'program:';
  var REFRESH_MS = 10 * 60 * 1000; // re-check the sheet while the page stays open

  var state = { dates: [], current: null, requested: '', shownJson: '', loadSeq: 0 };
  var el = function(id) { return document.getElementById(id); };

  // ── Data ────────────────────────────────────────────────────────────────

  function cacheGet(key) {
    try { return JSON.parse(localStorage.getItem(CACHE_PREFIX + key)); } catch (e) { return null; }
  }
  function cacheSet(key, data) {
    try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(data)); } catch (e) {}
  }

  // silent: background re-check of the page being viewed — no spinner, no error message.
  function load(date, push, silent) {
    var seq = ++state.loadSeq;
    var key = date || 'current';

    // Show the last copy we saw right away, then refresh from the sheet.
    var cached = silent ? null : cacheGet(key);
    if (cached) show(cached, date, push);
    else if (state.current && !silent) el('program').classList.add('loading');

    fetch(API_URL + (date ? '?date=' + encodeURIComponent(date) : ''))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (seq !== state.loadSeq) return;
        if (!data.ok) throw new Error(data.error);
        cacheSet(key, data);
        show(data, date, push && !cached);
      })
      .catch(function() {
        if (seq !== state.loadSeq || cached || silent) return;
        el('program').classList.remove('loading');
        el('program').innerHTML =
          '<div class="status">Unable to load the program right now.<br><button id="retry">Try again</button></div>';
        el('retry').onclick = function() { load(date, false); };
      });
  }

  function show(data, requested, push) {
    var json = JSON.stringify(data);
    if (!push && json === state.shownJson && requested === state.requested) return; // nothing changed
    state.shownJson = json;
    state.requested = requested || '';
    state.dates = data.dates || [];
    var p = data.program;
    state.current = p ? p.date : (requested || data.upcoming);

    el('program').classList.remove('loading');
    el('dateTitle').textContent = formatDate(state.current);
    document.title = formatDate(state.current) + ' · Tri Oaks Ward Sacrament Program';
    updateArrows();

    if (push) {
      var isDefault = !requested;
      history.pushState({ date: requested || '' }, '', isDefault ? location.pathname : '?date=' + state.current);
    }

    el('program').innerHTML = p ? renderProgram(p) :
      '<div class="status">No program has been posted for this date.</div>';
  }

  // ── Rendering ───────────────────────────────────────────────────────────

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function item(label, value) {
    if (!value) return '';
    return '<div class="label">' + esc(label) + '</div><div class="value">' + value + '</div>';
  }

  function hymnHtml(h) {
    if (!h) return '';
    var text = h.number ? '#' + h.number + ' – ' + h.title : h.text;
    return h.url ? '<a href="' + esc(h.url) + '" target="_blank" rel="noopener">' + esc(text) + '</a>' : esc(text);
  }

  function renderProgram(p) {
    var html = '';
    if (p.special) html += '<div class="special">' + esc(p.special) + '</div>';

    html += item('Presiding', esc(p.presiding));
    html += item('Conducting', esc(p.conducting));
    html += item('Chorister', esc(p.chorister));
    html += item('Organist', esc(p.organist));

    html += '<h2>Welcome &amp; Announcements</h2>';
    html += item('Opening Hymn', hymnHtml(p.openingHymn));
    html += item('Opening Prayer', esc(p.openingPrayer));

    html += '<h2>Ward &amp; Stake Business</h2>';
    html += item('Sacrament Hymn', hymnHtml(p.sacramentHymn));

    html += '<hr><h2>Administration of the Sacrament</h2><hr>';
    html += renderMeetingBody(p);

    html += item('Closing Hymn', hymnHtml(p.closingHymn));
    html += item('Closing Prayer', esc(p.closingPrayer));
    return html;
  }

  // Talks in order, with the intermediate hymn / musical number placed per the sheet's
  // "Intermediate Hymn Position" column (e.g. "After Speaker 1", "After Youth Speaker").
  function renderMeetingBody(p) {
    var talks = [];
    if (p.youthSpeaker) talks.push({ label: 'Youth Speaker', name: p.youthSpeaker, key: 'youth speaker' });
    (p.speakers || []).forEach(function(name, i) {
      talks.push({ label: 'Speaker', name: name, key: 'speaker ' + (i + 1) });
    });

    var mid = p.intermediate
      ? item(p.intermediate.number ? 'Intermediate Hymn' : 'Musical Number', hymnHtml(p.intermediate))
      : '';

    if (!talks.length) {
      var testimony = /fast/i.test(p.special || '');
      return (testimony ? '<div class="label">Bearing of Testimonies</div>' : '') + mid;
    }

    var pos = String(p.intermediatePosition || '').toLowerCase().replace(/^after\s+/, '').trim();
    var at = -1;
    talks.forEach(function(t, i) { if (t.key === pos) at = i; });
    if (at < 0) {
      // Default: after Speaker 1 when a talk follows it, otherwise after the first talk.
      var s1 = -1;
      talks.forEach(function(t, i) { if (t.key === 'speaker 1') s1 = i; });
      at = s1 >= 0 && s1 < talks.length - 1 ? s1 : 0;
    }

    var html = '';
    talks.forEach(function(t, i) {
      html += item(t.label, esc(t.name));
      if (i === at) html += mid;
    });
    return html;
  }

  function formatDate(iso) {
    if (!iso) return '';
    var p = iso.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  // ── Navigation ──────────────────────────────────────────────────────────

  function updateArrows() {
    var i = state.dates.indexOf(state.current);
    el('prev').disabled = i <= 0;
    el('next').disabled = i < 0 || i >= state.dates.length - 1;
  }

  function step(delta) {
    var i = state.dates.indexOf(state.current);
    var target = state.dates[i + delta];
    if (target) load(target === state.dates[state.dates.length - 1] ? '' : target, true);
  }

  el('prev').onclick = function() { step(-1); };
  el('next').onclick = function() { step(1); };
  document.addEventListener('keydown', function(e) {
    if (el('picker').open || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  window.addEventListener('popstate', function(e) {
    load((e.state && e.state.date) || new URLSearchParams(location.search).get('date') || '', false);
  });

  // ── Date picker ─────────────────────────────────────────────────────────

  el('dateBtn').onclick = function() {
    if (!state.dates.length) return;
    var byYear = {};
    state.dates.slice().reverse().forEach(function(d) {
      (byYear[d.slice(0, 4)] = byYear[d.slice(0, 4)] || []).push(d);
    });
    var html = '';
    Object.keys(byYear).sort().reverse().forEach(function(year) {
      html += '<div class="year">' + year + '</div><div class="dates">';
      byYear[year].forEach(function(d) {
        var p = d.split('-').map(Number);
        var label = new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        html += '<button data-date="' + d + '"' + (d === state.current ? ' aria-current="date"' : '') + '>' + label + '</button>';
      });
      html += '</div>';
    });
    el('pickerBody').innerHTML = html;
    el('picker').showModal();
    var cur = el('pickerBody').querySelector('[aria-current]');
    if (cur) cur.focus();
  };

  el('pickerBody').onclick = function(e) {
    var d = e.target.getAttribute('data-date');
    if (!d) return;
    el('picker').close();
    load(d === state.dates[state.dates.length - 1] ? '' : d, true);
  };
  el('pickerClose').onclick = function() { el('picker').close(); };
  el('picker').addEventListener('click', function(e) { if (e.target === el('picker')) el('picker').close(); });

  // ── Keep an open page up to date ────────────────────────────────────────
  // There's no way to push changes to an open page, so re-check when the viewer comes back
  // to it (e.g. unlocks their phone) and periodically while it's visible.

  function refresh() {
    if (document.visibilityState === 'visible' && !el('picker').open) load(state.requested, false, true);
  }
  document.addEventListener('visibilitychange', refresh);
  setInterval(refresh, REFRESH_MS);

  // ── Start ───────────────────────────────────────────────────────────────

  var initial = new URLSearchParams(location.search).get('date') || '';
  history.replaceState({ date: initial }, '', location.href);
  load(initial, false);
</script>
</body>
</html>
